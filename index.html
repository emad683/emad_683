<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Emad Ahmed - Frontend Developer Portfolio featuring interactive paper aesthetic design, creative web projects, and modern responsive UI experiences." />
    <meta name="theme-color" content="#fdfbf7" />
    <title>Emad Ahmed | Portfolio</title>
    <link rel="preload" as="image" href="/src/assets/image.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/assets/bg.webp" type="image/webp" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background-color: #fdfbf7; color: #1c1917; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 2rem 1.5rem; max-width: 72rem; margin: 0 auto; box-sizing: border-box;">
        <header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 3rem;">
          <span style="font-weight: 800; font-size: 1.25rem; letter-spacing: -0.025em;">Emad<span style="color: #78716c;">.dev</span></span>
        </header>
        <main style="display: flex; flex-direction: column; gap: 1rem; max-width: 42rem;">
          <div style="display: inline-flex; align-items: center; gap: 0.5rem; width: fit-content; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; background-color: #e7e5e4; color: #44403c;">
            <span style="width: 0.5rem; height: 0.5rem; border-radius: 9999px; background-color: #10b981; display: inline-block;"></span>
            Available for new projects
          </div>
          <h1 style="font-size: 2.5rem; font-weight: 900; line-height: 1.1; margin: 0; color: #1c1917;">
            Welcome, I'm Emad Ahmed
          </h1>
          <p style="font-size: 1.25rem; font-weight: 700; color: #57534e; margin: 0;">
            Frontend Developer &amp; UI Specialist
          </p>
          <p style="font-size: 1rem; color: #78716c; line-height: 1.6; margin: 0;">
            I design and build modern, interactive web experiences with high attention to detail, smooth animations, and clean scalable code.
          </p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
